name: Release gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node contract, tests, and Vercel build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.14.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check packages
        run: pnpm -r typecheck

      - name: Run workspace tests
        run: pnpm -r test

      - name: Audit production dependencies
        run: |
          pnpm audit --prod --audit-level=high || {
            echo "::group::Production dependency audit findings"
            pnpm audit --prod || true
            echo "::endgroup::"
            exit 1
          }

      - name: Build Vercel API bundle
        run: pnpm --filter @vvl/api-server build:vercel

      - name: Build public frontend
        env:
          VITE_DEMO_MODE: "false"
          VITE_PUBLIC_MODE: "true"
        run: pnpm --filter @vvl/home-value-planner build

      - name: Build API server binary
        run: pnpm --filter @vvl/api-server build

      - name: Start public-mode API and smoke
        env:
          PUBLIC_MODE: "true"
          DEMO_MODE: "false"
          API_HOST: "127.0.0.1"
          API_PORT: "4010"
        run: |
          node artifacts/api-server/dist/index.cjs &
          API_PID=$!
          cleanup() { kill "$API_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4010/api/health" >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -sf "http://127.0.0.1:4010/api/health" >/dev/null
          node scripts/smoke_public_release.mjs "http://127.0.0.1:4010" --api-only

  python:
    name: Python model-service tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run Python tests
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: artifacts/model-service
        run: python -m pytest -q

      - name: Warehouse strict gate (schema/import check)
        env:
          PYTHONPATH: artifacts/model-service
        run: python -c "import scripts.build_property_warehouse as w; print('warehouse module import ok', hasattr(w, 'enforce_quality_gates'))"

      - name: Validate strict pipeline
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: artifacts/model-service
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python scripts/build_all.py --strict

      - name: Load approved model artifacts when present
        env:
          PYTHONPATH: artifacts/model-service
        run: |
          python - <<'PY'
          from pathlib import Path

          from base_model.core import load_bundle as load_vancouver_bundle
          from halifax_model.core import load_bundle as load_halifax_bundle
          from uplift_model.core import load_uplift_bundle

          models_dir = Path("artifacts/model-service/models")
          vancouver_path = models_dir / "vancouver_base_price_bundle_v5.pkl"
          halifax_path = models_dir / "halifax_base_price_bundle_v1.pkl"
          uplift_path = models_dir / "seattle_observed_uplift_bundle_v2.pkl"

          if not any(path.is_file() for path in (vancouver_path, halifax_path, uplift_path)):
              print("no .pkl artifacts in checkout; loader covered by pytest")
              raise SystemExit(0)

          if vancouver_path.is_file():
              load_vancouver_bundle()
              print("vancouver artifact loaded without training")
          if halifax_path.is_file():
              load_halifax_bundle()
              print("halifax artifact loaded without training")
          if uplift_path.is_file():
              uplift_bundle = load_uplift_bundle()
              if not uplift_bundle.ready:
                  raise RuntimeError(f"Seattle uplift artifact unavailable or invalid: {uplift_bundle.message}")
              print("uplift artifact loaded without training")
          PY

      - name: Verify generated outputs match committed artifacts
        env:
          PYTHONHASHSEED: "0"
          PYTHONPATH: artifacts/model-service
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python scripts/verify_generated_outputs.py
