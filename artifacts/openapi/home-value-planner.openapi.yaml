openapi: 3.1.0
info:
  title: Vancouver Deal Analyzer API
  version: 0.4.0
  description: >
    Public API for the streamlined Vancouver investor dashboard. The frontend
    now uses one deal-analysis endpoint plus a cited project explainer endpoint.
    The Express API still calls the Python model service internally for base
    value and uplift estimates.
servers:
  - url: http://127.0.0.1:4000
paths:
  /health:
    get:
      summary: API server health
      responses:
        "200":
          description: API health payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHealthResponse"
  /api/deal/analyze:
    post:
      summary: Analyze one Vancouver investment deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealAnalyzeRequest"
      responses:
        "200":
          description: Deal analysis response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealAnalyzeResponse"
        "400":
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/assistant/query:
    post:
      summary: Ask a cited project/model question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantQueryRequest"
      responses:
        "200":
          description: Cited project explainer response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantQueryResponse"
        "400":
          description: Request validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    ApiHealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
        mode:
          type: string
      required: [ok, service, mode]
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
        issues:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required: [path, message]
      required: [message]
    PropertyType:
      type: string
      enum: [Detached, Townhouse, Condo, Duplex]
    PlannedFlag:
      type: string
      enum:
        - renovatedKitchen
        - renovatedBathrooms
        - legalSuiteAdded
        - energyEfficient
        - deferredMaintenanceResolved
        - roofIssueResolved
    DealAnalyzeRequest:
      type: object
      additionalProperties: false
      properties:
        postalCode:
          type: string
          pattern: "^V[56][A-Z]\\s?\\d[A-Z]\\d$"
        propertyType:
          $ref: "#/components/schemas/PropertyType"
        livingAreaSqft:
          type: number
          minimum: 250
          maximum: 10000
        bedrooms:
          type: number
          minimum: 0
          maximum: 10
        bathrooms:
          type: number
          minimum: 0
          maximum: 10
        yearBuilt:
          type: integer
          minimum: 1800
        knownCurrentValue:
          type: number
          exclusiveMinimum: 0
        plannedFlags:
          type: array
          items:
            $ref: "#/components/schemas/PlannedFlag"
        horizonMonths:
          type: number
          minimum: 3
          maximum: 18
        askingPrice:
          type: number
          exclusiveMinimum: 0
        budget:
          type: number
          exclusiveMinimum: 0
        timelineMonths:
          type: number
          minimum: 3
          maximum: 18
      required: [postalCode, propertyType, livingAreaSqft, bedrooms, bathrooms, askingPrice, budget, timelineMonths]
    EstimateSummary:
      type: object
      properties:
        modelVersion:
          type: string
        trainingMode:
          type: string
        modelFamily:
          type: string
          enum: [xgboost, random-forest]
        modelScope:
          $ref: "#/components/schemas/PropertyType"
        baseValue:
          type: number
        confidenceLow:
          type: number
        confidenceHigh:
          type: number
        pricePerSqft:
          type: number
        confidenceRatio:
          type: number
      required: [modelVersion, trainingMode, modelFamily, modelScope, baseValue, confidenceLow, confidenceHigh, pricePerSqft, confidenceRatio]
    PlanSummary:
      type: object
      properties:
        status:
          type: string
          enum: [ready, data-missing]
        targetAssessment:
          type: string
          enum: [Likely, Stretch, Unlikely]
        baseValue:
          type: number
        achievableValue:
          type: number
        targetPrice:
          type: number
        gapToTarget:
          type: number
        plannedSpend:
          type: number
        plannedMonths:
          type: number
    DealAnalyzeResponse:
      type: object
      properties:
        dealLabel:
          type: string
          enum: [Strong lead, Worth review, Needs caution, Pass for now]
        modeledValueGap:
          type: number
        valueGapPercent:
          type: number
        afterPlanValue:
          type: number
        estimatedGrossUpside:
          type: number
        grossUpsidePercent:
          type: number
        riskFlags:
          type: array
          items:
            type: object
            properties:
              level:
                type: string
                enum: [info, warning, danger]
              label:
                type: string
              detail:
                type: string
            required: [level, label, detail]
        estimate:
          $ref: "#/components/schemas/EstimateSummary"
        plan:
          $ref: "#/components/schemas/PlanSummary"
      required: [dealLabel, modeledValueGap, valueGapPercent, afterPlanValue, estimatedGrossUpside, grossUpsidePercent, riskFlags, estimate, plan]
    AssistantQueryRequest:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
          minLength: 3
          maxLength: 500
        topK:
          type: integer
          minimum: 1
          maximum: 8
      required: [question]
    AssistantQueryResponse:
      type: object
      properties:
        answer:
          type: string
        confidence:
          type: string
          enum: [high, medium, low]
        citations:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              source:
                type: string
              snippet:
                type: string
              score:
                type: number
            required: [title, source, snippet, score]
        suggestedQuestions:
          type: array
          items:
            type: string
      required: [answer, confidence, citations, suggestedQuestions]
