openapi: 3.1.0
info:
  title: Canada Investor Dashboard API
  version: 0.5.0
  description: >
    Public API for the Estimate -> Improve -> Plan workflow. In live mode the
    Express API calls the Python model service. In demo mode it returns stable
    sample JSON from the demo folder.
servers:
  - url: http://127.0.0.1:4000
paths:
  /health:
    get:
      summary: API server health
      responses:
        "200":
          description: API health payload
  /api/estimate:
    post:
      summary: Estimate current listing value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyInput"
      responses:
        "200":
          description: Estimate response
        "400":
          description: Request validation error
  /api/simulate:
    post:
      summary: Simulate renovation value uplift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimulateRequest"
      responses:
        "200":
          description: Simulate response
        "400":
          description: Request validation error
  /api/plan:
    post:
      summary: Build investor action plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: Plan response
        "400":
          description: Request validation error
  /api/deal/analyze:
    post:
      summary: Analyze one Vancouver investment deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealAnalyzeRequest"
      responses:
        "200":
          description: Deal analysis response
        "400":
          description: Request validation error
  /api/insights:
    get:
      summary: Return demo-safe sample investment insight rows
      responses:
        "200":
          description: Demo-safe metrics response
components:
  schemas:
    PropertyType:
      type: string
      enum: [Detached, Townhouse, Condo, Duplex]
    PlannedFlag:
      type: string
      enum:
        - renovatedKitchen
        - renovatedBathrooms
        - legalSuiteAdded
        - energyEfficient
        - deferredMaintenanceResolved
        - roofIssueResolved
    PropertyInput:
      type: object
      additionalProperties: false
      properties:
        postalCode:
          type: string
          pattern: "^V[56][A-Z]\\s?\\d[A-Z]\\d$"
        propertyType:
          $ref: "#/components/schemas/PropertyType"
        livingAreaSqft:
          type: number
          minimum: 250
          maximum: 10000
        bedrooms:
          type: number
          minimum: 0
          maximum: 10
        bathrooms:
          type: number
          minimum: 0
          maximum: 10
        yearBuilt:
          type: integer
          minimum: 1800
        knownCurrentValue:
          type: number
          exclusiveMinimum: 0
      required: [postalCode, propertyType, livingAreaSqft, bedrooms, bathrooms]
    SimulateRequest:
      allOf:
        - $ref: "#/components/schemas/PropertyInput"
        - type: object
          properties:
            plannedFlags:
              type: array
              items:
                $ref: "#/components/schemas/PlannedFlag"
            horizonMonths:
              type: number
              minimum: 3
              maximum: 18
    PlanRequest:
      allOf:
        - $ref: "#/components/schemas/SimulateRequest"
        - type: object
          properties:
            targetPrice:
              type: number
              exclusiveMinimum: 0
            budget:
              type: number
              exclusiveMinimum: 0
            timelineMonths:
              type: number
              minimum: 3
              maximum: 18
          required: [targetPrice, budget, timelineMonths]
    DealAnalyzeRequest:
      allOf:
        - $ref: "#/components/schemas/SimulateRequest"
        - type: object
          properties:
            askingPrice:
              type: number
              exclusiveMinimum: 0
            budget:
              type: number
              exclusiveMinimum: 0
            timelineMonths:
              type: number
              minimum: 3
              maximum: 18
          required: [askingPrice, budget, timelineMonths]
